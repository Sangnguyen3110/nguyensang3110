                {sport:"Bóng rổ", model:["Kobe","mada","James"]},
            ]
        }
        for(let i in myObject.hobbies){
            x +="<h2>" + myObject.sport[i].name+"</h2>"
            for(let j in myObject.sport[i].model){
                x +=myObject.sport[i].mode[j]+"<br>";
            }
        }
        documennt.getElementByid("demo").innerHTML=x;
